version = 1
mode = "server"
strict = true

[flags2env]
contract = ".cli-flags.toml"
require_audit = true
precedence = "argv-over-env"

[server]
enabled = true
bind_addr_binding = "bind_addr"
database_url_binding = "database_url"

[[env]]
name = "bind_addr"
key = "FANWAAVE_WEB_BIND"
kind = "string"
required = false
secret = false
default = "0.0.0.0:8080"

[[env]]
name = "database_url"
key = "FANWAAVE_DATABASE_URL"
kind = "url"
required = true
secret = true
description = "Database credential URI from the approved runtime secret boundary."
