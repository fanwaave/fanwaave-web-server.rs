name: mtls-connector-smoke

on:
  pull_request:
    paths:
      - "src/transport/mtls_connector.rs"
      - "src/transport/mod.rs"
      - "Cargo.toml"
      - "test-support/mtls-connector-smoke/**"
      - ".github/workflows/mtls-connector-smoke.yml"
      - "docs/mtls-connector-smoke.md"
  push:
    branches: [dev]
    paths:
      - "src/transport/mtls_connector.rs"
      - "test-support/mtls-connector-smoke/**"
      - ".github/workflows/mtls-connector-smoke.yml"

permissions:
  contents: read

jobs:
  real-rustls-handshakes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Rust toolchain and strict Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check production connector and isolated crate formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition=2021 --check src/transport/mtls_connector.rs
          cargo fmt --manifest-path test-support/mtls-connector-smoke/Cargo.toml -- --check
      - name: Create ephemeral client/server CA identities (runner only)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/fanwaave-mtls-fixtures"
          mkdir -p "$root"
          cd "$root"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -subj "/CN=fanwaave-ci-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout ca.key -out ca.pem >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -subj "/CN=fanwaave-rogue-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout rogue-ca.key -out rogue-ca.pem >/dev/null 2>&1
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:localhost\n' > server.ext
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=clientAuth\n' > client.ext
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.csr >/dev/null 2>&1
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key \
            -CAcreateserial -days 1 -sha256 -extfile server.ext \
            -out server.pem >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj "/CN=fanwaave-ci-client" \
            -keyout client.key -out client.csr >/dev/null 2>&1
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key \
            -CAcreateserial -days 1 -sha256 -extfile client.ext \
            -out client.pem >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -subj "/CN=fanwaave-untrusted-client" \
            -keyout rogue-client.key -out rogue-client.csr >/dev/null 2>&1
          openssl x509 -req -in rogue-client.csr -CA rogue-ca.pem -CAkey rogue-ca.key \
            -CAcreateserial -days 1 -sha256 -extfile client.ext \
            -out rogue-client.pem >/dev/null 2>&1
          # Produce a genuinely expired client certificate, signed by the
          # trusted CA. Its dates are fixed in 2020, not clock-flaky -days 0.
          openssl req -newkey rsa:2048 -nodes -subj "/CN=expired-ci-client" \
            -keyout expired-client.key -out expired-client.csr >/dev/null 2>&1
          mkdir -p newcerts
          : > index.txt
          printf '1000\n' > serial
          cat > expired-ca.cnf <<'CONF'
          [ ca ]
          default_ca = CA_default
          [ CA_default ]
          database = ./index.txt
          new_certs_dir = ./newcerts
          certificate = ./ca.pem
          private_key = ./ca.key
          serial = ./serial
          default_md = sha256
          policy = policy_any
          [ policy_any ]
          commonName = supplied
          [ client_ext ]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = clientAuth
          CONF
          openssl ca -batch -config expired-ca.cnf \
            -in expired-client.csr -out expired-client.pem -notext \
            -startdate 20200101000000Z -enddate 20200102000000Z \
            -extensions client_ext >/dev/null 2>&1
          test "$(openssl x509 -in expired-client.pem -noout -enddate)" = \
            'notAfter=Jan  2 00:00:00 2020 GMT'
          openssl verify -CAfile ca.pem server.pem client.pem
          openssl verify -CAfile rogue-ca.pem rogue-client.pem
          echo "FANWAAVE_TLS_FIXTURES=$root" >> "$GITHUB_ENV"
      - name: Run actual production Rustls connector with positive and negative mTLS handshakes
        run: cargo test --manifest-path test-support/mtls-connector-smoke/Cargo.toml --all-targets
      - name: Strict Clippy for production connector and real handshake tests
        run: cargo clippy --manifest-path test-support/mtls-connector-smoke/Cargo.toml --all-targets -- -D warnings
