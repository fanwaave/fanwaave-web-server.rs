name: ORES runtime contracts
on:
  pull_request:
    paths: ['.zpkg.toml', '.zpkg.lock', '.cli-flags.toml', '.ores-*.toml', '.shared-auth.toml', '.auth-shared.toml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ores-runtime-contracts.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ores-runtime-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ZED_CLI_REV: a1c5b7a3c72b957944b76911fcbc723dd9c16541
  FLAGS2ENV_REV: 333c2ace93c362d274171ab0e0edf613d96a8e59
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: '${{ env.EXPECTED_HEAD }}', persist-credentials: false }
      # Public source/manifest checks must execute even when the separately
      # managed private ores-cli package is not yet published or authorized.
      # Passing these checks NEVER means the runtime package is admitted.
      - name: Verify exact source and local authority files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f .zpkg.toml
          test -f .cli-flags.toml
          ! (test -f .shared-auth.toml && test -f .auth-shared.toml)
          ! grep -R --line-number --fixed-strings 'github.com/ORESoftware/flags-2-env' Cargo.toml Cargo.lock .zpkg.toml 2>/dev/null
          git diff --exit-code HEAD

      - name: Build immutable public Zed and flags-2-env validator tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zed-pkg/zed-cli.git "$RUNNER_TEMP/zed-cli"
          git -C "$RUNNER_TEMP/zed-cli" checkout --detach "$ZED_CLI_REV"
          test "$(git -C "$RUNNER_TEMP/zed-cli" rev-parse HEAD)" = "$ZED_CLI_REV"
          (cd "$RUNNER_TEMP/zed-cli" && cargo build --locked --release --bin zed)
          git clone --filter=blob:none https://github.com/flags-2-env/flags-2-env.git "$RUNNER_TEMP/flags2env"
          git -C "$RUNNER_TEMP/flags2env" checkout --detach "$FLAGS2ENV_REV"
          test "$(git -C "$RUNNER_TEMP/flags2env" rev-parse HEAD)" = "$FLAGS2ENV_REV"
          make -C "$RUNNER_TEMP/flags2env" all

      - name: Validate public package and flag authorities without private CLI
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zed-cli/target/release/zed" validate --manifest .zpkg.toml
          "$RUNNER_TEMP/flags2env/build/flags2env" audit .cli-flags.toml
          git diff --exit-code HEAD

      # This admission step is REQUIRED. If registry publication or the
      # explicitly approved private distribution channel is unavailable, it
      # fails: subsequent ores-cli doctor/audit tests are SKIPPED, not PASS.
      # Never borrow source credentials from another repo or use a local
      # lookalike binary to make the runtime contract appear green.
      - name: Admit actual immutable ores-cli package from approved registry
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/oresc-zed-consumer"
          mkdir -p "$consumer"
          (cd "$consumer" && "$RUNNER_TEMP/zed-cli/target/release/zed" install oresoftware/ores-cli@=0.1.0 --do-not-write-new-manifest --allow-build --adapter none)

      - name: Execute actual ores-cli doctor and repo audit contracts
        shell: bash
        run: |
          set -euo pipefail
          ZED_BIN="$RUNNER_TEMP/zed-cli/target/release/zed"
          consumer="$RUNNER_TEMP/oresc-zed-consumer"
          (cd "$consumer" && "$ZED_BIN" run oresc -- --no-json doctor)
          (cd "$consumer" && "$ZED_BIN" run ores-cli -- --no-json doctor)
          (cd "$consumer" && "$ZED_BIN" run oresc -- --no-json audit repo --path "$GITHUB_WORKSPACE" --profile baseline)
          (cd "$consumer" && "$ZED_BIN" run ores-cli -- --no-json audit repo --path "$GITHUB_WORKSPACE" --profile baseline)
          (cd "$consumer" && "$ZED_BIN" run oresc -- --no-json audit repo --path "$GITHUB_WORKSPACE" --profile source)
          git diff --exit-code HEAD
