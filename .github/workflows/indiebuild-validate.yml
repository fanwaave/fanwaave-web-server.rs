name: IndieBuild contract validation

on:
  pull_request:
    paths:
      - ".indiebuild.toml"
      - ".github/workflows/indiebuild-validate.yml"
  push:
    branches: [main]
    paths:
      - ".indiebuild.toml"
      - ".github/workflows/indiebuild-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gha-indie-worker/gha-indie-worker-cli
          ref: 221020a6d8884959158740c45c520c48b1cd51a7
          path: .indiebuild-validator
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Validate normalized IndieBuild contract through flags-2-env CLI
        shell: bash
        run: |
          set -euo pipefail
          cd .indiebuild-validator
          cargo run --locked --bin ghaiw -- \
            indiebuild-validate \
            --indiebuild-config="$GITHUB_WORKSPACE/.indiebuild.toml"
