# ORES middleware repository contract.
# Contract/runtime baseline: ORESoftware/ores-middleware@ee75f0a67cf23895500846402fbc757aa0686530.
# Cross-runtime authority parity is fail-closed through ORESoftware/typespec-json-schema-validator.
# This repo contains a server boundary and browser-facing code at the same root; target selection is explicit.
schema_version = 1
repository_mode = "hybrid"
allow_overlapping_roots = true
default_target = "client"

[[targets]]
name = "server"
role = "server"
roots = ["."]
middleware = "disabled"

[[targets]]
name = "client"
role = "client"
roots = ["."]
middleware = "propagation-only"
propagate_headers = ["traceparent", "tracestate", "baggage", "x-request-id"]
