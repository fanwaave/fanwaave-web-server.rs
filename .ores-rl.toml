# Contract authority: ores-rate-limit/ores-rl-interfaces@241353d0f5269450690d9646be03db2aba59a2ae
schemaVersion = "ores.rate-limit.config.v1"
layout = "server-only"
defaultPolicyId = "default"

[server]
root = "."
backend = "local"
enforcementLayer = "service"
keyHmacEnv = "ORES_RL_HMAC_KEY"

[[policies]]
policyId = "default"
clientVisible = false
algorithm = "token-bucket"
identityScope = "anonymous-ip"
capacity = 120
windowMs = 0
refillTokens = 120
refillIntervalMs = 60000
requestCost = 1
enforcementMode = "observe-only"
consistencyMode = "advisory"
backendFailureMode = "fail-open"
denyCacheMode = "local-denials"
denyCacheCapacity = 1024
maxOvershoot = 120
maxBlockTtlMs = 60000
keyVersion = "v1"
policyVersion = 1
