# ORES rate-limit repository contract.
# Peer authority baseline: ores-rate-limit/ores-rl-interfaces@241353d0f5269450690d9646be03db2aba59a2ae.
# TJSV validator baseline: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc.
# Secret-bearing settings are environment-variable names only. Do not promote HMAC/credential values to argv;
# flags-2-env may resolve non-secret executable options into the same process environment before startup.
schemaVersion = "ores.rate-limit.config.v1"
layout = "combined"
defaultPolicyId = "repo-default"

[client]
root = "."
exposePolicyMetadata = true

[server]
root = "."
backend = "local"
enforcementLayer = "service"
keyHmacEnv = "ORES_RL_HMAC_KEY"

[[policies]]
policyId = "repo-default"
clientVisible = true
algorithm = "token-bucket"
identityScope = "authenticated-subject"
capacity = 120
windowMs = 0
refillTokens = 120
refillIntervalMs = 60000
requestCost = 1
enforcementMode = "disabled"
consistencyMode = "advisory"
backendFailureMode = "fail-open"
denyCacheMode = "local-denials"
denyCacheCapacity = 256
maxOvershoot = 0
maxBlockTtlMs = 60000
keyVersion = "v1"
policyVersion = 1
