# flags-2-env surface for `fanwaave-web`.
# Secret-bearing database credentials are intentionally environment-only.
[help]
url = "https://github.com/fanwaave/fanwaave-web-server.rs"

[env]
load = false

[parse]
allow_unknown = false

[flags.config]
env = "FANWAAVE_CONFIG"
long = "config"
help = "Path to TOML configuration"

[flags.api_base]
env = "FANWAAVE_API_BASE"
long = "api-base"
help = "API HTTP base URL"

[flags.json]
env = "FANWAAVE_JSON"
long = "json"
switch = true
help = "Emit JSON"

[flags.fanwaave-api-http-base]
env = "FANWAAVE_API_HTTP_BASE"
long = "fanwaave-api-http-base"
type = "string"
help = "Runtime environment key FANWAAVE_API_HTTP_BASE."

[flags.fanwaave-web-bind]
env = "FANWAAVE_WEB_BIND"
long = "fanwaave-web-bind"
type = "string"
help = "Runtime environment key FANWAAVE_WEB_BIND."
