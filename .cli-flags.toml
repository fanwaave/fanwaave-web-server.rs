# flags-2-env surface for `fanwaave-web`
[help]
url = "https://github.com/fanwaave/fanwaave-web-server.rs"

[parse]
allow_unknown = false

[flags.config]
env = "FANWAAVE_CONFIG"
long = "config"
help = "Path to TOML configuration"

[flags.api_base]
env = "FANWAAVE_API_BASE"
long = "api-base"
help = "API HTTP base URL"

[flags.json]
env = "FANWAAVE_JSON"
long = "json"
switch = true
help = "Emit JSON"

[flags.bind]
env = "FANWAAVE_WEB_BIND"
aliases = ["bind", "fanwaave-web-bind"]
type = "string"
default = "127.0.0.1:8081"
help = "HTTP bind address."

[flags.api-http-base]
env = "FANWAAVE_API_HTTP_BASE"
aliases = ["api-http-base", "fanwaave-api-http-base"]
type = "string"
help = "API HTTP base URL."

[flags.database-url]
env = "FANWAAVE_DATABASE_URL"
aliases = ["database-url", "fanwaave-database-url"]
type = "string"
help = "Optional database URL for direct reads."
