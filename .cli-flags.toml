[help]
url = "https://github.com/fanwaave/fanwaave-web-server.rs"

[env]
load = false

[parse]
allow_unknown = false

[flags.config]
env = "FANWAAVE_CONFIG"
aliases = ["config"]
type = "string"
help = "Path to compatibility configuration. Fanwaave domain policy is .fanwaave-cfg.toml."

[flags.api-base]
env = "FANWAAVE_API_BASE"
aliases = ["api-base"]
type = "string"
help = "API HTTP base URL."

[flags.json]
env = "FANWAAVE_JSON"
aliases = ["json"]
type = "bool"
help = "Emit JSON."

[flags.fanwaave-api-http-base]
env = "FANWAAVE_API_HTTP_BASE"
aliases = ["fanwaave-api-http-base"]
type = "string"
help = "Fanwaave API HTTP base URL used by the web server."

[flags.fanwaave-web-bind]
env = "FANWAAVE_WEB_BIND"
aliases = ["fanwaave-web-bind"]
type = "string"
help = "Fanwaave web-server bind address."
